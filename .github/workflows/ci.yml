name: BE CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build -x test

# 로컬 올라마 테스트 원할 경우 -Dspring.autoconfigure.exclude 설정 제거 후 테스트하세요(기본 옵션은 exclude입니다)
      - name: Test
        run: ./gradlew test -Dspring.autoconfigure.exclude=org.springframework.ai.model.ollama.autoconfigure.OllamaAutoConfiguration

  # 공통 보안 사항 [.github repo]의 yml 호출 용도. 절대 삭제하지 마세요.
  security-scan:
    uses: Wiza-Project/.github/.github/workflows/reusable-security.yml@main
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}