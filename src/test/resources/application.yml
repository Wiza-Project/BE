spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS VECTOR AS OTHER;
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-secret-key-at-least-32-bytes-long
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600
  file:
    upload-dir: ./build/test-uploads

logging:
  level:
    com.gnagnoohc.scms: debug
