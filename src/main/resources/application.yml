spring:
  application:
    name: scms
  profiles:
    active: local
  config:
    import: optional:classpath:application-secret.yml
  ai:
    model:
      chat: google-genai
      embedding: ollama

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:9999}
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600
  file:
    upload-dir: ${user.home}/scms-uploads
  career:
    matching:
      top-k: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.gnagnoohc.scms: debug
    org.hibernate.orm.jdbc.bind: trace
